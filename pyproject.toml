[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-tts-api"
version = "2.1.0"
description = "REST API for Chatterbox TTS with OpenAI compatibility"
authors = [{ name = "DBC", email = "krje@dbc.dk" }]
readme = "README.md"
license = { text = "AGPLv3" }
requires-python = ">=3.13, <3.14"
dependencies = [
  "coral-chatterbox @ git+https://github.com/alexandrainst/coral_chatterbox.git",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "huggingface_hub>=0.30.0",
  "psutil>=5.9.0",
  "prometheus-client>=0.20.0",
  "nltk>=3.8.0",
]

[project.urls]
Repository = "https://github.com/DBCDK/chatterbox-tts-api"

[project.optional-dependencies]
dev = ["requests>=2.28.0"]
test = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "requests>=2.28.0",
  "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = ["requests>=2.28.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "api: marks tests as API tests",
  "streaming: marks tests as streaming integration tests",
]
